<script>
// ===== FORCE GENERATED CODES TO BE INITIALIZED =====
let generatedCodes = JSON.parse(localStorage.getItem('activation_codes') || '');

// Log for debugging
console.log(' Generated codes loaded:', generatedCodes.length);

// Override the generateCode function to ensure save
const originalGenerate = window.generateCode;
window.generateCode = function() {
 console.log(' Generating code...');
 
 // Get values
 const storeName = document.getElementById('storeNameInput').value.trim();
 const machineId = document.getElementById('machineIdInput').value.trim();
 const month = document.getElementById('codeMonth').value;
 const year = document.getElementById('codeYear').value;
 const owner = document.getElementById('ownerNameInput').value.trim();
 const phone = document.getElementById('storePhoneInput').value.trim();
 const status = document.getElementById('status');
 const codeDisplay = document.getElementById('codeDisplay');
 
 if (!storeName ||!machineId) {
 status.className = 'status error show';
 status.textContent = ' Please enter store name and Machine ID.';
 return;
 }
 
 // Generate code
 const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
 let parts =;
 for (let i = 0; i < 4; i++) {
 let part = '';
 for (let j = 0; j < 4; j++) {
 part += chars.charAt(Math.floor(Math.random() * chars.length));
 }
 parts.push(part);
 }
 const code = parts.join('-');
 const expiryDate = new Date();
 expiryDate.setDate(expiryDate.getDate() + 30);
 
 // Save code
 const codeData = {
 code: code,
 storeName: storeName,
 machineId: machineId,
 ownerName: owner || 'Unknown',
 phone: phone || '',
 month: month,
 year: year,
 generated: new Date().toISOString(),
 expires: expiryDate.toISOString(),
 active: true,
 revoked: false,
 used: false,
 usedBy: null,
 usedDate: null
 };
 
 generatedCodes.push(codeData);
 localStorage.setItem('activation_codes', JSON.stringify(generatedCodes));
 
 // Display
 document.getElementById('generatedCode').textContent = code;
 document.getElementById('codeExpiry').textContent = expiryDate.toLocaleDateString() + ' (30 days)';
 codeDisplay.style.display = 'block';
 status.className = 'status success show';
 status.textContent = ' Code generated and SAVED! (' + generatedCodes.length + ' total codes)';
 
 renderCodeList();
 console.log(' Code saved:', code);
 console.log(' Total codes now:', generatedCodes.length);
};
</script>
