<!DOCTYPE html> <html> <head> <title>Setup Database</title> </head> <body> <h2>[STOCK] Setting up Database</h2> <div id="result"></div> <script src="db.js"></script> <script> const DB_NAME = 'SokoPulsePOS'; const DB_VERSION = 6; function setupDatabase() { const result = document.getElementById('result'); result.innerHTML = ' Setting up database...'; const req = indexedDB.open(DB_NAME, DB_VERSION); for (const [name, indexes] of Object.entries(stores)) { if (!db.objectStoreNames.contains(name)) { const store = db.createObjectStore(name, { keyPath: 'id', autoIncrement: true }); for (const idx of indexes) { store.createIndex(idx, idx, { unique: false }); } created.push(name); console.log('[SUCCESS] Created store:', name); } } result.innerHTML = created.length > 0 ? '[SUCCESS] Created stores: ' + created.join(', ') : '[SUCCESS] All stores already exist'; }; req.onsuccess = function(e) { const db = e.target.result; const stores = Array.from(db.objectStoreNames); result.innerHTML += '<br><br>[LIST] Available stores: ' + stores.join(', '); result.innerHTML += '<br><br>[SUCCESS] Database ready!'; result.innerHTML += '<br><br><a href="activation.html">[KEY] Go to Activation</a>'; db.close(); }; req.onerror = function(e) { result.innerHTML = '[ERROR] Error: ' + e.target.error; }; } setupDatabase(); </script> <script> if ('serviceWorker' in navigator) { window.addEventListener('load', function() { navigator.serviceWorker.register('/sw.js') .then(function(reg) { console.log('[SUCCESS] Service Worker registered'); }) .catch(function(err) { console.log('[ERROR] Service Worker registration failed:', err); }); }); } </script> </body> </html>
