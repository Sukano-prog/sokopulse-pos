<script>
// ===== SYSTEM OWNER PASSWORD PROTECTION =====
function checkSystemOwner() {
    // Check if already authenticated
    if (sessionStorage.getItem('admin_authenticated') === 'true') {
        return true;
    }
    
    // Check for stored user (only system owner should access)
    const userData = localStorage.getItem('pos_user');
    if (userData) {
        try {
            const user = JSON.parse(userData);
            // Only allow specific username (system owner)
            // Change this to your username
            if (user.username === 'admin' && user.role === 'admin') {
                // Also check if this is the system owner (you)
                // You can add a special flag or just use the username
                if (user.username === 'admin') {
                    sessionStorage.setItem('admin_authenticated', 'true');
                    return true;
                }
            }
        } catch(e) {}
    }
    
    // If not authenticated, ask for password
    const password = prompt('🔑 Enter System Owner Password:');
    if (password === 'Linux@123') {  // CHANGE THIS PASSWORD
        sessionStorage.setItem('admin_authenticated', 'true');
        return true;
    } else {
        alert('❌ Access Denied! Redirecting to POS...');
        window.location.href = 'pos.html';
        return false;
    }
}

// Run check immediately
if (!checkSystemOwner()) {
    // Redirect already happens in checkSystemOwner
}
</script>

<div class="container">

    <p class="subtitle">Generate activation keys with auto-expiry dates.</p>

    <div class="form-group">

<script src="db.js"></script>
<script>
// ============================================================
// ADMIN ACTIVATION TOOL - WITH AUTO-EXPIRY
// ============================================================

let generatedKeys = JSON.parse(localStorage.getItem('generated_keys') || '[]');

// ===== UPDATE EXPIRY DATE =====
function updateExpiryDate() {
    const type = document.getElementById('licenseType').value;
    const expiryInput = document.getElementById('customExpiry');
    const info = document.getElementById('expiryInfo');
    const now = new Date();
    
    let expiryDate = new Date(now);
    let label = '';
    
    switch(type) {
        case 'permanent':
            expiryDate.setFullYear(now.getFullYear() + 10);
            label = '♾️ Never expires';
            break;
        case '1year':
            expiryDate.setFullYear(now.getFullYear() + 1);
            label = '📅 Expires in 1 year';
            break;
        case '6months':
            expiryDate.setMonth(now.getMonth() + 6);
            label = '📅 Expires in 6 months';
            break;
        case '3months':
            expiryDate.setMonth(now.getMonth() + 3);
            label = '📅 Expires in 3 months';
            break;
        case '1month':
            expiryDate.setMonth(now.getMonth() + 1);
            label = '📅 Expires in 1 month';
            break;
        case 'trial':
            expiryDate.setDate(now.getDate() + 14);
            label = '🧪 Expires in 14 days (trial)';
            break;
        default:
            expiryDate.setFullYear(now.getFullYear() + 10);
            label = '♾️ Never expires';
    }
    
    expiryInput.value = expiryDate.toISOString().slice(0, 10);
    info.textContent = label;
}

// ===== GENERATE KEY =====
function generateKey() {
    const machineId = document.getElementById('machineIdInput').value.trim();
    const type = document.getElementById('licenseType').value;
    const expiryDateStr = document.getElementById('customExpiry').value;
    const status = document.getElementById('status');
    const keyDisplay = document.getElementById('generatedKey');
    const keyEl = document.getElementById('activationKey');
    const expiryDisplay = document.getElementById('expiryDisplay');
    
    if (!machineId || machineId.length < 10) {
        status.className = 'status error show';
        status.textContent = '❌ Please enter a valid Machine ID';
        return;
    }
    
    // Generate key
    const today = new Date();
    const date = today.getFullYear() + 
                 String(today.getMonth() + 1).padStart(2, '0') + 
                 String(today.getDate()).padStart(2, '0');
    
    let hash = '';
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    for (let i = 0; i < 4; i++) {
        hash += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    
    const typeMap = {
        'permanent': 'PERM',
        '1year': 'Y1YR',
        '6months': 'M6MO',
        '3months': 'M3MO',
        '1month': 'M1MO',
        'trial': 'TRIAL'
    };
    
    const key = typeMap[type] + '-' + date + '-' + hash;
    
    // Save the license with expiry
    const license = {
        key: key,
        machineId: machineId,
        type: type,
        generated: new Date().toISOString(),
        expires: new Date(expiryDateStr).toISOString(),
        isActive: true
    };
    
    generatedKeys.push(license);
    localStorage.setItem('generated_keys', JSON.stringify(generatedKeys));
    
    // Display the key
    keyEl.textContent = key;
    const expiryDisplayStr = new Date(expiryDateStr).toLocaleDateString();
    const typeLabels = {
        'permanent': '♾️ Permanent',
        '1year': '📅 1 Year',
        '6months': '📅 6 Months',
        '3months': '📅 3 Months',
        '1month': '📅 1 Month',
        'trial': '🧪 Trial'
    };
    expiryDisplay.textContent = typeLabels[type] + ' | Expires: ' + expiryDisplayStr;
    keyDisplay.style.display = 'block';
    status.className = 'status success show';
    status.textContent = '✅ Key generated successfully!';
    
    renderLicenseList();
}

function copyKey() {
    const key = document.getElementById('activationKey').textContent;
    navigator.clipboard.writeText(key).then(() => {
        alert('✅ Key copied to clipboard!');
    }).catch(() => {
        const input = document.createElement('input');
        input.value = key;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        alert('✅ Key copied!');
    });
}

function renderLicenseList() {
    const container = document.getElementById('licenseList');
    if (generatedKeys.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8;">No licenses generated yet.</p>';
        return;
    }
    
    const typeLabels = {
        'permanent': '♾️',
        '1year': '📅 1Y',
        '6months': '📅 6M',
        '3months': '📅 3M',
        '1month': '📅 1M',
        'trial': '🧪'
    };
    
    let html = '';
    generatedKeys.slice().reverse().forEach((lic, index) => {
        const expires = new Date(lic.expires);
        const now = new Date();
        const isExpired = expires < now;
        const daysLeft = Math.ceil((expires - now) / (1000 * 60 * 60 * 24));
        const originalIndex = generatedKeys.length - 1 - index;
        
        let statusClass = 'status-badge';
        let statusText = '✅ Active';
        if (isExpired) {
            statusClass += ' expired';
            statusText = '⚠️ Expired';
        } else if (daysLeft < 30) {
            statusClass += ' expiring';
            statusText = '⚠️ ' + daysLeft + ' days left';
        }
        
        html += `<div class="license-item">
            <div>
                <div class="key-text">${lic.key}</div>
                <div class="info">${typeLabels[lic.type] || lic.type} | Expires: ${expires.toLocaleDateString()} ${isExpired ? '❌' : ''}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <span class="${statusClass}">${statusText}</span>
                <button onclick="deleteLicense(${originalIndex})" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:14px;">✕</button>
            </div>
        </div>`;
    });
    container.innerHTML = html;
}

function deleteLicense(index) {
    if (!confirm('Delete this license?')) return;
    generatedKeys.splice(index, 1);
    localStorage.setItem('generated_keys', JSON.stringify(generatedKeys));
    renderLicenseList();
}

function clearAllKeys() {
    if (!confirm('Delete ALL licenses?')) return;
    generatedKeys = [];
    localStorage.setItem('generated_keys', JSON.stringify(generatedKeys));
    renderLicenseList();
}

// Init
updateExpiryDate();
renderLicenseList();
</script>

            })
            .catch(function(err) {
                console.log('❌ Service Worker registration failed:', err);
            });

}
</script>
