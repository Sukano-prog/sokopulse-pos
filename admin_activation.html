<body>
<div class="container">
    <div class="logo">
        <h1> <span>Soko</span>Pulse</h1>
        <p>Admin - Activation Code Generator</p>
    </div>
    
    <div class="status" id="status"></div>
    
    <!-- Code Generation Form -->
    <div class="form-row">
        <div class="form-group">
            <label>Store Name *</label>
            <input type="text" id="storeNameInput" placeholder="Store name">
        </div>
        <div class="form-group">
            <label>Machine ID *</label>
            <input type="text" id="machineIdInput" placeholder="Paste Machine ID here" style="font-family:monospace;font-size:13px;">
        </div>
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label>Month</label>
            <select id="codeMonth">
                <option value="JAN">January</option>
                <option value="FEB">February</option>
                <option value="MAR">March</option>
                <option value="APR">April</option>
                <option value="MAY">May</option>
                <option value="JUN">June</option>
                <option value="JUL">July</option>
                <option value="AUG" selected>August</option>
                <option value="SEP">September</option>
                <option value="OCT">October</option>
                <option value="NOV">November</option>
                <option value="DEC">December</option>
            </select>
        </div>
        <div class="form-group">
            <label>Year</label>
            <select id="codeYear">
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
            </select>
        </div>
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label>Owner Name</label>
            <input type="text" id="ownerNameInput" placeholder="Store owner">
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" id="storePhoneInput" placeholder="Phone number">
        </div>
    </div>
    
    <button class="btn btn-primary" onclick="generateCode()"> Generate Activation Code</button>
    
    <!-- Code Display -->
    <div id="codeDisplay" style="display:none;">
        <div class="code-box">
            <div class="label">Activation Code (Send to Store Owner)</div>
            <div class="code" id="generatedCode">XXXX-XXXX-XXXX-XXXX</div>
            <div style="font-size:12px;color:#64748b;margin-top:4px;">
                Valid for: <span id="codeExpiry">30 days</span>
            </div>
        </div>
        <button class="btn btn-secondary" onclick="copyCode()" style="width:100%;"> Copy Code</button>
    </div>
    
    <!-- Code List -->
    <div class="code-list">
        <div class="toolbar">
            <h3> Active Codes</h3>
            <span style="font-size:12px;color:#94a3b8;" id="codeCount">Total: 0</span>
            <button class="btn btn-secondary btn-sm" onclick="exportCodes()"> Export</button>
            <button class="btn btn-danger btn-sm" onclick="revokeAll()"> Revoke All</button>
        </div>
        <div id="codeListContainer">
            <p style="color:#94a3b8;font-size:13px;">No codes generated yet.</p>
        </div>
    </div>

<script>
// ===== STATE =====
let generatedCodes = JSON.parse(localStorage.getItem('activation_codes') || '[]');

// ===== GENERATE CODE =====
function generateCode() {
    const storeName = document.getElementById('storeNameInput').value.trim();
    const machineId = document.getElementById('machineIdInput').value.trim();
    const month = document.getElementById('codeMonth').value;
    const year = document.getElementById('codeYear').value;
    const owner = document.getElementById('ownerNameInput').value.trim();
    const phone = document.getElementById('storePhoneInput').value.trim();
    const status = document.getElementById('status');
    const codeDisplay = document.getElementById('codeDisplay');
    
    if (!storeName) {
        status.className = 'status error show';
        status.textContent = ' Please enter store name.';
        return;
    }
    if (!machineId || machineId.length < 10) {
        status.className = 'status error show';
        status.textContent = ' Please enter a valid Machine ID.';
        return;
    }
    
    // Generate code: XXXX-XXXX-XXXX-XXXX
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let parts = [];
    for (let i = 0; i < 4; i++) {
        let part = '';
        for (let j = 0; j < 4; j++) {
            part += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        parts.push(part);
    }
    const code = parts.join('-');
    const expiryDate = new Date();
    expiryDate.setDate(expiryDate.getDate() + 30);
    
    // Save to localStorage
    const codeData = {
        code: code,
        storeName: storeName,
        machineId: machineId,
        ownerName: owner || 'Unknown',
        phone: phone || '',
        month: month,
        year: year,
        generated: new Date().toISOString(),
        expires: expiryDate.toISOString(),
        active: true,
        revoked: false,
        used: false,
        usedBy: null,
        usedDate: null
    };
    
    generatedCodes.push(codeData);
    localStorage.setItem('activation_codes', JSON.stringify(generatedCodes));
    
    // Display
    document.getElementById('generatedCode').textContent = code;
    document.getElementById('codeExpiry').textContent = expiryDate.toLocaleDateString() + ' (30 days)';
    codeDisplay.style.display = 'block';
    status.className = 'status success show';
    status.textContent = ' Code generated and saved!';
    
    renderCodeList();
}

// ===== RENDER CODE LIST =====
function renderCodeList() {
    const container = document.getElementById('codeListContainer');
    const count = document.getElementById('codeCount');
    
    if (generatedCodes.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8;font-size:13px;">No codes generated yet.</p>';
        count.textContent = 'Total: 0';
        return;
    }
    
    count.textContent = 'Total: ' + generatedCodes.length;
    
    // Show only the latest 50 codes, sorted by newest first
    const sorted = [...generatedCodes].reverse().slice(0, 50);
    
    let html = '';
    sorted.forEach(function(c, index) {
        const originalIndex = generatedCodes.length - 1 - index;
        const isActive = c.active && !c.revoked && !c.used;
        const statusClass = c.revoked ? 'revoked' : (c.used ? 'used' : 'active');
        const statusLabel = c.revoked ? ' Revoked' : (c.used ? ' Used' : ' Active');
        
        html += '<div class="code-item">';
        html += '<div class="info">';
        html += '<div class="code-text"> ' + c.code + '</div>';
        html += '<div class="details">';
        html += 'Machine: ' + (c.machineId ? c.machineId.slice(0, 16) + '...' : 'N/A');
        if (c.phone) html += ' |  ' + c.phone;
        html += ' | ' + c.storeName;
        if (c.ownerName && c.ownerName !== 'Unknown') html += ' (' + c.ownerName + ')';
        html += '<br>Generated: ' + new Date(c.generated).toLocaleDateString() + ' | Expires: ' + new Date(c.expires).toLocaleDateString();
        html += '</div>';
        html += '</div>';
        html += '<span class="badge ' + statusClass + '">' + statusLabel + '</span>';
        html += '<div class="actions">';
        if (c.active && !c.revoked) {
            html += '<button class="btn btn-danger btn-sm" onclick="revokeCode(' + originalIndex + ')"> Revoke</button>';
        }
        html += '<button class="btn btn-secondary btn-sm" onclick="deleteCode(' + originalIndex + ')"></button>';
        html += '</div>';
        html += '</div>';
    });
    container.innerHTML = html;
}

// ===== REVOKE CODE =====
function revokeCode(index) {
    if (!confirm('Revoke this code?')) return;
    generatedCodes[index].revoked = true;
    generatedCodes[index].active = false;
    localStorage.setItem('activation_codes', JSON.stringify(generatedCodes));
    renderCodeList();
    document.getElementById('status').className = 'status info show';
    document.getElementById('status').textContent = ' Code revoked.';
}

// ===== DELETE CODE =====
function deleteCode(index) {
    if (!confirm('Delete this code permanently?')) return;
    generatedCodes.splice(index, 1);
    localStorage.setItem('activation_codes', JSON.stringify(generatedCodes));
    renderCodeList();
    document.getElementById('status').className = 'status info show';
    document.getElementById('status').textContent = ' Code deleted.';
}

// ===== REVOKE ALL =====
function revokeAll() {
    if (!confirm('Revoke ALL active codes?')) return;
    generatedCodes.forEach(function(c) {
        if (c.active && !c.revoked) {
            c.revoked = true;
            c.active = false;
        }
    });
    localStorage.setItem('activation_codes', JSON.stringify(generatedCodes));
    renderCodeList();
    document.getElementById('status').className = 'status info show';
    document.getElementById('status').textContent = ' All codes revoked.';
}

// ===== COPY CODE =====
function copyCode() {
    const code = document.getElementById('generatedCode').textContent;
    navigator.clipboard.writeText(code).then(() => {
        alert(' Code copied: ' + code);
    }).catch(() => {
        const input = document.createElement('input');
        input.value = code;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        alert(' Code copied: ' + code);
    });
}

// ===== EXPORT CODES =====
function exportCodes() {
    if (generatedCodes.length === 0) {
        alert('No codes to export.');
        return;
    }
    let csv = 'Code,Store,Machine ID,Owner,Phone,Generated,Expires,Status\n';
    generatedCodes.forEach(function(c) {
        const status = c.revoked ? 'Revoked' : (c.used ? 'Used' : 'Active');
        csv += c.code + ',' + c.storeName + ',' + c.machineId + ',' + c.ownerName + ',' + c.phone + ',' + c.generated + ',' + c.expires + ',' + status + '\n';
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'activation_codes_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
}

// ===== INIT =====
renderCodeList();

// Auto-format Machine ID input (remove spaces, keep case)
document.getElementById('machineIdInput').addEventListener('input', function() {
    this.value = this.value.trim();
});
</script>

</script>
