<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - SokoPulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; padding: 20px; }
        .container { background: white; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); padding: 40px; width: 420px; max-width: 100%; position: relative; }
        .container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #1a3c34, #f5a623); border-radius: 24px 24px 0 0; }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo h1 { font-size: 28px; font-weight: 800; color: #1a3c34; }
        .logo h1 span { color: #f5a623; }
        .logo p { color: #94a3b8; font-size: 14px; margin-top: 4px; }
        .warning { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 12px 14px; border-radius: 6px; font-size: 13px; color: #92400e; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 14px; font-family: 'Inter', sans-serif; transition: all 0.2s; background: #f8fafc; }
        .form-group input:focus { outline: none; border-color: #1a3c34; background: white; box-shadow: 0 0 0 4px rgba(26,60,52,0.1); }
        .password-requirements { font-size: 11px; color: #94a3b8; margin-top: 6px; padding-left: 4px; }
        .password-requirements .req { display: block; margin: 2px 0; }
        .password-requirements .req.valid { color: #22c55e; }
        .password-requirements .req.invalid { color: #ef4444; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #1a3c34, #2a5c54); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26,60,52,0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .error-msg { background: #fef2f2; color: #dc2626; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; border: 1px solid #fecaca; }
        .error-msg.show { display: block; }
        .success-msg { background: #dcfce7; color: #166534; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; border: 1px solid #bbf7d0; }
        .success-msg.show { display: block; }
        .strength-bar { height: 4px; background: #e2e8f0; border-radius: 2px; margin-top: 8px; overflow: hidden; }
        .strength-fill { height: 100%; transition: all 0.3s; width: 0%; }
        .strength-text { font-size: 11px; margin-top: 4px; color: #94a3b8; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1><span>Soko</span>Pulse</h1>
        <p>Change Your Password</p>
    </div>
    
    <div class="warning" id="firstLoginWarning" style="display:none;">
        You are using the default password. For security, please change it now.
    </div>
    
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    
    <form id="changePasswordForm" onsubmit="changePassword(event)">
        <div class="form-group">
            <label>Current Password</label>
            <input type="password" id="currentPassword" placeholder="Enter current password" required>
        </div>
        
        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password" oninput="checkPasswordStrength()" required>
            <div class="password-requirements">
                <span class="req" id="reqLength">✗ At least 8 characters</span>
                <span class="req" id="reqUpper">✗ At least 1 uppercase letter</span>
                <span class="req" id="reqLower">✗ At least 1 lowercase letter</span>
                <span class="req" id="reqNumber">✗ At least 1 number</span>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <div class="strength-text" id="strengthText">Password strength: -</div>
        </div>
        
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter new password" required>
        </div>
        
        <button type="submit" class="btn" id="submitBtn">Change Password</button>
    </form>
</div>

<script src="db.js"></script>
<script>
// Check if first login
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('first_login') === 'true') {
    document.getElementById('firstLoginWarning').style.display = 'block';
}

// Password strength checker
function checkPasswordStrength() {
    const password = document.getElementById('newPassword').value;
    
    const checks = {
        length: password.length >= 8,
        upper: /[A-Z]/.test(password),
        lower: /[a-z]/.test(password),
        number: /[0-9]/.test(password)
    };
    
    // Update requirement indicators
    updateReq('reqLength', checks.length);
    updateReq('reqUpper', checks.upper);
    updateReq('reqLower', checks.lower);
    updateReq('reqNumber', checks.number);
    
    // Calculate strength
    const passed = Object.values(checks).filter(Boolean).length;
    const fill = document.getElementById('strengthFill');
    const text = document.getElementById('strengthText');
    
    const strengths = [
        { pct: 0, color: '#e2e8f0', label: '-' },
        { pct: 25, color: '#ef4444', label: 'Weak' },
        { pct: 50, color: '#f59e0b', label: 'Fair' },
        { pct: 75, color: '#3b82f6', label: 'Good' },
        { pct: 100, color: '#22c55e', label: 'Strong' }
    ];
    
    const strength = strengths[passed];
    fill.style.width = strength.pct + '%';
    fill.style.background = strength.color;
    text.textContent = 'Password strength: ' + strength.label;
    text.style.color = strength.color;
}

function updateReq(id, valid) {
    const el = document.getElementById(id);
    if (valid) {
        el.className = 'req valid';
        el.textContent = '✓' + el.textContent.substring(1);
    } else {
        el.className = 'req invalid';
        el.textContent = '✗' + el.textContent.substring(1);
    }
}

// Change password
async function changePassword(e) {
    e.preventDefault();
    
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    errorMsg.classList.remove('show');
    successMsg.classList.remove('show');
    
    // Validate passwords match
    if (newPassword !== confirmPassword) {
        errorMsg.textContent = 'New passwords do not match';
        errorMsg.classList.add('show');
        return;
    }
    
    // Validate strength
    if (newPassword.length < 8) {
        errorMsg.textContent = 'Password must be at least 8 characters';
        errorMsg.classList.add('show');
        return;
    }
    if (!/[A-Z]/.test(newPassword)) {
        errorMsg.textContent = 'Password must contain at least 1 uppercase letter';
        errorMsg.classList.add('show');
        return;
    }
    if (!/[a-z]/.test(newPassword)) {
        errorMsg.textContent = 'Password must contain at least 1 lowercase letter';
        errorMsg.classList.add('show');
        return;
    }
    if (!/[0-9]/.test(newPassword)) {
        errorMsg.textContent = 'Password must contain at least 1 number';
        errorMsg.classList.add('show');
        return;
    }
    
    // Get current user
    const userData = localStorage.getItem('pos_user');
    if (!userData) {
        errorMsg.textContent = 'No user logged in';
        errorMsg.classList.add('show');
        return;
    }
    const user = JSON.parse(userData);
    
    try {
        const db = await openDB();
        const users = await dbGetAll(db, 'users');
        const dbUser = users.find(u => u.username === user.username);
        
        if (!dbUser) {
            errorMsg.textContent = 'User not found in database';
            errorMsg.classList.add('show');
            return;
        }
        
        // Verify current password
        if (dbUser.password !== currentPassword) {
            errorMsg.textContent = 'Current password is incorrect';
            errorMsg.classList.add('show');
            return;
        }
        
        // Update password
        dbUser.password = newPassword;
        dbUser.must_change_password = false;
        dbUser.password_changed_at = new Date().toISOString();
        
        const tx = db.transaction('users', 'readwrite');
        const store = tx.objectStore('users');
        store.put(dbUser);
        
        // Log audit
        try {
            const logData = {
                user: user.username,
                action: 'update',
                details: 'Password changed',
                date: new Date().toISOString()
            };
            const logTx = db.transaction('audit_log', 'readwrite');
            logTx.objectStore('audit_log').add(logData);
        } catch(e) { console.log('Audit log failed', e); }
        
        successMsg.textContent = 'Password changed successfully! Redirecting...';
        successMsg.classList.add('show');
        
        setTimeout(function() {
            window.location.href = 'pos.html';
        }, 1500);
        
    } catch(e) {
        errorMsg.textContent = 'Error: ' + e.message;
        errorMsg.classList.add('show');
    }
}
</script>
</body>
</html>
