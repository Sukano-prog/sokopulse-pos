<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SokoPulse POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
        }
        .login-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
            padding: 48px 40px;
            width: 420px;
            max-width: 95%;
            position: relative;
            overflow: hidden;
        }
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #1a3c34, #f5a623);
        }
        .logo-section { text-align: center; margin-bottom: 32px; }
        .logo-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #1a3c34, #2a5c54);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 12px;
            box-shadow: 0 8px 24px rgba(26,60,52,0.2);
        }
        .logo-text { font-size: 28px; font-weight: 800; color: #1a3c34; letter-spacing: -0.5px; }
        .logo-text span { color: #f5a623; }
        .logo-sub { color: #94a3b8; font-size: 14px; margin-top: 4px; }
        .welcome-text { text-align: center; margin-bottom: 28px; }
        .welcome-text h2 { font-size: 20px; font-weight: 600; color: #0f172a; }
        .welcome-text p { color: #94a3b8; font-size: 14px; margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #e2e8f0; border-radius: 12px;
            font-size: 14px; font-family: 'Inter', sans-serif;
            transition: all 0.2s; background: #f8fafc;
        }
        .form-group input:focus {
            outline: none; border-color: #1a3c34;
            background: white; box-shadow: 0 0 0 4px rgba(26,60,52,0.1);
        }
        .login-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #1a3c34, #2a5c54);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; font-family: 'Inter', sans-serif;
            cursor: pointer; transition: all 0.2s; margin-top: 4px;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26,60,52,0.3); }
        .error-msg {
            background: #fef2f2; color: #dc2626;
            padding: 10px 14px; border-radius: 10px;
            font-size: 13px; margin-bottom: 16px;
            display: none; border: 1px solid #fecaca;
        }
        .error-msg.show { display: block; }
        .status-bar {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; font-size: 12px; color: #94a3b8; margin-bottom: 20px;
        }
        .status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #22c55e; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        @media (max-width: 480px) {
            .login-container { padding: 32px 20px; }
            .logo-text { font-size: 24px; }
        }
        .demo-credentials {
            margin-top: 24px; padding: 16px 20px;
            background: #f8fafc; border-radius: 12px;
            border: 1px dashed #e2e8f0;
        }
        .demo-credentials p { font-size: 12px; color: #94a3b8; text-align: center; margin-bottom: 8px; }
        .demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .demo-item {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 12px; background: white;
            border-radius: 8px; font-size: 12px; color: #334155;
            border: 1px solid #e2e8f0;
        }
        .demo-item .role-badge {
            font-size: 9px; font-weight: 700; text-transform: uppercase;
            padding: 2px 8px; border-radius: 20px;
            background: #1a3c34; color: white;
        }
        .demo-item .role-badge.cashier { background: #f5a623; color: #1a3c34; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon">🏪</div>
            <div class="logo-text"><span>Soko</span>Pulse</div>
            <div class="logo-sub">Point of Sale System</div>
        </div>
        <div class="welcome-text">
            <h2>Welcome back 👋</h2>
            <p>Sign in to continue to your dashboard</p>
        </div>
        <div class="status-bar">
            <span class="status-dot"></span>
            <span id="dbStatus">Initializing database...</span>
        </div>
        <div class="error-msg" id="errorMsg">Invalid username or password</div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="login-btn">🔐 Sign In</button>
        </form>
        <div class="demo-credentials">
            <p>🔑 Demo Credentials</p>
            <div class="demo-grid">
                <div class="demo-item">admin <span class="role-badge">Admin</span></div>
                <div class="demo-item">cashier <span class="role-badge cashier">Cashier</span></div>
            </div>
        </div>
    </div>

    <script src="db.js"></script>
    <script>
        // ===== ACTIVATION CHECK =====
        if (localStorage.getItem("activated") !== "true") {
            window.location.href = "activation.html";
        }

        const DEFAULT_USERS = [
            { username: 'admin', password: '********', role: 'admin', name: 'Administrator' },
            { username: 'cashier', password: '********', role: 'cashier', name: 'Cashier' }
        ];

        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('SokoPulsePOS', 7);
                request.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    const stores = {
                        'products': ['name', 'category', 'barcode', 'price'],
                        'customers': ['name', 'phone', 'email'],
                        'orders': ['order_number', 'customer_id', 'date', 'status'],
                        'returns': ['order_number', 'status', 'date'],
                        'audit_log': ['user', 'action', 'date'],
                        'stock_movements': ['product_id', 'type', 'date'],
                        'settings': ['key'],
                        'users': ['username', 'role'],
                        'categories': ['name', 'parent_id']
                    };
                    for (const [name, indexes] of Object.entries(stores)) {
                        if (!db.objectStoreNames.contains(name)) {
                            const store = db.createObjectStore(name, { keyPath: 'id', autoIncrement: true });
                            for (const idx of indexes) {
                                store.createIndex(idx, idx, { unique: false });
                            }
                        }
                    }
                };
                request.onsuccess = function(e) {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = function(e) {
                    reject(e.target.error);
                };
            });
        }

        function dbAdd(storeName, data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const request = store.add(data);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function dbGetAll(storeName) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function initDB() {
            try {
                await openDB();
                const users = await dbGetAll('users');
                if (users.length === 0) {
                    for (const user of DEFAULT_USERS) {
                        await dbAdd('users', user);
                    }
                }
                document.getElementById('dbStatus').textContent = '✅ Database ready';
                document.getElementById('dbStatus').style.color = '#22c55e';
            } catch(e) {
                document.getElementById('dbStatus').textContent = '⚠️ Database error';
                document.getElementById('dbStatus').style.color = '#ef4444';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.classList.remove('show');

            if (!username || !password) {
                errorMsg.textContent = 'Please enter username and password';
                errorMsg.classList.add('show');
                return;
            }

            try {
                const users = await dbGetAll('users');
                const user = users.find(u => u.username === username && u.password === password);
                if (user) {
                    localStorage.setItem('pos_user', JSON.stringify({
                        id: user.id,
                        username: user.username,
                        role: user.role,
                        name: user.name
                    }));
                    window.location.href = 'pos.html';
                } else {
                    errorMsg.textContent = 'Invalid username or password';
                    errorMsg.classList.add('show');
                }
            } catch(e) {
                errorMsg.textContent = 'Error: ' + e.message;
                errorMsg.classList.add('show');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initDB();
            if (localStorage.getItem('pos_user')) {
                window.location.href = 'pos.html';
            }
        });
    </script>
</body>
</html>
