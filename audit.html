<script>

function isAdmin() {
    try {
        const user = JSON.parse(localStorage.getItem("pos_user") || "{}");
        return user.role === "admin";
    } catch(e) {
        return false;
    }
}
if (!isAdmin()) {
    window.location.href = "pos.html";
}


// ===== DATABASE FUNCTIONS =====
function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open('SokoPulsePOS', 6);
        req.onupgradeneeded = function(e) {
            const db = e.target.result;
            // Create audit_log store if it doesn't exist
            if (!db.objectStoreNames.contains('audit_log')) {
                const store = db.createObjectStore('audit_log', { keyPath: 'id', autoIncrement: true });
                store.createIndex('date', 'date', { unique: false });
                store.createIndex('user', 'user', { unique: false });
                store.createIndex('action', 'action', { unique: false });
            }
            // Create customers store if it doesn't exist
            if (!db.objectStoreNames.contains('customers')) {
                const store = db.createObjectStore('customers', { keyPath: 'id', autoIncrement: true });
                store.createIndex('phone', 'phone', { unique: true });
                store.createIndex('email', 'email', { unique: false });
            }
            // Create settings store if it doesn't exist
            if (!db.objectStoreNames.contains('settings')) {
                db.createObjectStore('settings', { keyPath: 'key' });
            }
        };
        req.onsuccess = function(e) { resolve(e.target.result); };
        req.onerror = function(e) { reject(e.target.error); };
    });
}

function dbGetAll(db, storeName) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const store = tx.objectStore(storeName);
        const req = store.getAll();
        req.onsuccess = function() { resolve(req.result); };
        req.onerror = function() { reject(req.error); };
    });
}

function dbAdd(db, storeName, data) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        const req = store.add(data);
        req.onsuccess = function() { resolve(req.result); };
        req.onerror = function() { reject(req.error); };
    });
}

function dbPut(db, storeName, data) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        const req = store.put(data);
        req.onsuccess = function() { resolve(req.result); };
        req.onerror = function() { reject(req.error); };
    });
}

function dbDelete(db, storeName, id) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        const req = store.delete(id);
        req.onsuccess = function() { resolve(); };
        req.onerror = function() { reject(req.error); };
    });
}

// ============================================================
// AUDIT LOG - COMPLETE SCRIPT
// ============================================================

var auditLogs = [];

// ===== DB HELPERS =====

// ===== SIDEBAR =====
function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
    document.querySelector('.sidebar-overlay').classList.toggle('show');
}

function logout() {
    if (confirm('Logout?')) {
        localStorage.removeItem('pos_user');
        window.location.href = 'index.html';
    }
}

function updateTime() {
    var el = document.getElementById('timeDisplay');
    if (el) el.textContent = new Date().toLocaleTimeString('en-KE', { hour12: false });
}

// ===== LOAD AUDIT =====

async function loadAudit() {
    try {
        var db = await openDB();
        // Check if audit_log store exists
        if (!db.objectStoreNames.contains('audit_log')) {
            console.log('⚠️ audit_log store not found - creating it now');
            // Create the store by closing and reopening with upgrade
            db.close();
            var req = indexedDB.open('SokoPulsePOS', 6);
            req.onupgradeneeded = function(e) {
                var db2 = e.target.result;
                if (!db2.objectStoreNames.contains('audit_log')) {
                    var store = db2.createObjectStore('audit_log', { keyPath: 'id', autoIncrement: true });
                    store.createIndex('date', 'date', { unique: false });
                    store.createIndex('user', 'user', { unique: false });
                    store.createIndex('action', 'action', { unique: false });
                    console.log('✅ Created audit_log store');
                }
            };
            req.onsuccess = function(e) {
                var db2 = e.target.result;
                auditLogs = [];
                renderAudit();
                console.log('📋 Audit store created, no records yet');
            };
            req.onerror = function(e) {
                console.error('Error creating audit store:', e);
                document.getElementById('auditList').innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">Error creating audit log</div>';
            };
            return;
        }
        
        auditLogs = await dbGetAll(db, 'audit_log');
        // Sort by date descending
        auditLogs.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
        renderAudit();
        console.log('📋 Audit loaded:', auditLogs.length, 'records');
    } catch(e) {
        console.error('Error loading audit:', e);
        document.getElementById('auditList').innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">Error loading audit log</div>';
    }
}


function renderAudit() {
    var container = document.getElementById('auditList');
    var search = document.getElementById('searchInput').value.toLowerCase();
    var filter = document.getElementById('actionFilter').value;

    var filtered = auditLogs;
    if (search) {
        filtered = filtered.filter(function(a) {
            return (a.user || '').toLowerCase().includes(search) ||
                   (a.action || '').toLowerCase().includes(search) ||
                   (a.details || '').toLowerCase().includes(search);
        });
    }
    if (filter !== 'all') {
        filtered = filtered.filter(function(a) { return a.action === filter; });
    }

    if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">No audit records found</div>';
        return;
    }

    var actionLabels = {
        'login': '🔐 Login',
        'sale': '💰 Sale',
        'return': '🔄 Return',
        'adjust': '📊 Stock Adjust',
        'delete': '🗑️ Delete',
        'update': '✏️ Update',
        'credit': '💳 Credit'
    };

    var actionClasses = {
        'login': 'login',
        'sale': 'sale',
        'return': 'return',
        'adjust': 'adjust',
        'delete': 'delete',
        'update': 'update',
        'credit': 'credit'
    };

    var html = '';
    filtered.forEach(function(a) {
        var actionLabel = actionLabels[a.action] || a.action;
        var actionClass = actionClasses[a.action] || '';
        var date = new Date(a.date);
        var timeStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        html += '<div class="audit-item">';
        html += '<div class="info">';
        html += '<span class="action-badge ' + actionClass + '">' + actionLabel + '</span>';
        html += ' <span class="action">' + (a.details || '') + '</span>';
        html += '<div class="user">👤 ' + (a.user || 'System') + '</div>';
        html += '</div>';
        html += '<div class="time">' + timeStr + '</div>';
        html += '</div>';
    });

    container.innerHTML = html;
}

// ===== EXPORT AUDIT =====
function exportAudit() {
    if (auditLogs.length === 0) {
        alert('No audit data to export');
        return;
    }
    var csv = 'Date,User,Action,Details\n';
    auditLogs.forEach(function(a) {
        var date = new Date(a.date).toLocaleString();
        csv += date + ',' + (a.user || 'System') + ',' + (a.action || '') + ',' + (a.details || '') + '\n';
    });
    var blob = new Blob([csv], { type: 'text/csv' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'audit_log_' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    alert('✅ Audit exported!');
}

// ===== LOG ACTION =====
function logAction(action, details) {
    var user = JSON.parse(localStorage.getItem('pos_user') || '{}');
    var log = {
        user: user.username || 'System',
        action: action,
        details: details,
        date: new Date().toISOString()
    };
    openDB().then(function(db) {
        dbAdd(db, 'audit_log', log);
    }).catch(function(e) {
        console.error('Error logging action:', e);
    });
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', function() {
    var userData = localStorage.getItem('pos_user');
    if (!userData) {
        window.location.href = 'index.html';
        return;
    }
    var user = JSON.parse(userData);
    document.getElementById('userName').textContent = user.name || user.username;
    document.getElementById('userRole').textContent = user.role || 'User';

    setInterval(updateTime, 1000);
    updateTime();

    // Create audit_log store if needed
    openDB().then(function(db) {
        if (!db.objectStoreNames.contains('audit_log')) {
            // Store doesn't exist, will be created on upgrade
            console.log('⚠️ Audit log store not found, will be created on next upgrade');
        }
        loadAudit();
    });
});
</script>
</body>

<script>

function isAdmin() {
    try {
        const user = JSON.parse(localStorage.getItem("pos_user") || "{}");
        return user.role === "admin";
    } catch(e) {
        return false;
    }
}
if (!isAdmin()) {
    window.location.href = "pos.html";
}

// ===== AUDIT DATE FILTER =====
function applyAuditFilter() {
    var period = document.getElementById('auditPeriod').value;
    var startDate, endDate;
    var now = new Date();
    var today = now.toISOString().slice(0, 10);
    
    // Show/hide custom dates
    document.getElementById('auditCustomDates').style.display = period === 'custom' ? 'flex' : 'none';
    
    if (period === 'custom') {
        startDate = document.getElementById('auditStartDate').value;
        endDate = document.getElementById('auditEndDate').value;
        if (!startDate || !endDate) {
            alert('Please select both start and end dates');
            return;
        }
    } else {
        var start = new Date(now);
        switch(period) {
            case 'today': break;
            case 'yesterday': start.setDate(start.getDate() - 1); break;
            case 'week': start.setDate(start.getDate() - 7); break;
            case 'month': start.setDate(start.getDate() - 30); break;
            case 'quarter': start.setDate(start.getDate() - 90); break;
            case 'year': start.setFullYear(start.getFullYear() - 1); break;
            default: start.setDate(start.getDate() - 7);
        }
        startDate = start.toISOString().slice(0, 10);
        endDate = today;
    }
    
    // Store filter
    window.auditStartDate = startDate;
    window.auditEndDate = endDate;
    
    document.getElementById('auditDateInfo').textContent = '📆 ' + startDate + ' → ' + endDate;
    
    // Re-render audit with filter
    renderAudit();
}

// Override renderAudit to use date filter
var originalRenderAudit = renderAudit;
renderAudit = function() {
    var container = document.getElementById('auditList');
    var search = document.getElementById('searchInput').value.toLowerCase();
    var filter = document.getElementById('actionFilter').value;
    
    var filtered = auditLogs;
    
    // Apply date filter
    if (window.auditStartDate && window.auditEndDate) {
        filtered = filtered.filter(function(a) {
            if (!a.date) return false;
            var d = a.date.slice(0, 10);
            return d >= window.auditStartDate && d <= window.auditEndDate;
        });
    }
    
    // Apply search
    if (search) {
        filtered = filtered.filter(function(a) {
            return (a.user || '').toLowerCase().includes(search) ||
                   (a.action || '').toLowerCase().includes(search) ||
                   (a.details || '').toLowerCase().includes(search);
        });
    }
    
    // Apply action filter
    if (filter !== 'all') {
        filtered = filtered.filter(function(a) { return a.action === filter; });
    }

    if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">No audit records found for this period</div>';
        return;
    }

    var actionLabels = {
        'login': '🔐 Login',
        'sale': '💰 Sale',
        'return': '🔄 Return',
        'adjust': '📊 Stock Adjust',
        'delete': '🗑️ Delete',
        'update': '✏️ Update',
        'credit': '💳 Credit',
        'logout': '🚪 Logout'
    };

    var actionClasses = {
        'login': 'login',
        'sale': 'sale',
        'return': 'return',
        'adjust': 'adjust',
        'delete': 'delete',
        'update': 'update',
        'credit': 'credit',
        'logout': 'login'
    };

    var html = '';
    filtered.forEach(function(a) {
        var actionLabel = actionLabels[a.action] || a.action;
        var actionClass = actionClasses[a.action] || '';
        var date = new Date(a.date);
        var timeStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        html += '<div class="audit-item">';
        html += '<div class="info">';
        html += '<span class="action-badge ' + actionClass + '">' + actionLabel + '</span>';
        html += ' <span class="action">' + (a.details || '') + '</span>';
        html += '<div class="user">👤 ' + (a.user || 'System') + '</div>';
        html += '</div>';
        html += '<div class="time">' + timeStr + '</div>';
        html += '</div>';
    });

    container.innerHTML = html;
};

// Init audit filter on page load
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
        var today = new Date();
        var start = new Date();
        start.setDate(start.getDate() - 7);
        document.getElementById('auditStartDate').value = start.toISOString().slice(0, 10);
        document.getElementById('auditEndDate').value = today.toISOString().slice(0, 10);
        applyAuditFilter();
    }, 300);
});
</script>
