<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Log - SokoPulse</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .audit-wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .audit-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .audit-head h1 { margin: 0; font-size: 20px; }
  .audit-head a { font-size: 12px; color: #1a3c34; font-weight: 600; text-decoration: none; }
  .audit-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .audit-filters input, .audit-filters select {
    padding: 8px 10px; border: 2px solid #e2e8f0; border-radius: 8px;
    font-family: inherit; font-size: 13px; background: white;
  }
  .audit-filters button {
    padding: 8px 12px; background: #1a3c34; color: white; border: none;
    border-radius: 8px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .audit-day { background: white; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .audit-day h3 { margin: 0 0 8px; font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
  .audit-row {
    display: grid; grid-template-columns: 50px 80px 1fr auto 16px;
    gap: 10px; padding: 9px 6px; border-bottom: 1px solid #f1f5f9;
    cursor: pointer; align-items: center; border-radius: 6px;
    font-size: 13px;
  }
  .audit-row:hover { background: #f8fafc; }
  .audit-row:last-child { border-bottom: none; }
  .audit-time { font-size: 12px; color: #94a3b8; font-variant-numeric: tabular-nums; }
  .audit-user { font-size: 12px; font-weight: 600; color: #334155; overflow: hidden; text-overflow: ellipsis; }
  .audit-action { color: #0f172a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .audit-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
  .badge-sale { background: #dcfce7; color: #166534; }
  .badge-edit { background: #fef3c7; color: #92400e; }
  .badge-delete { background: #fee2e2; color: #991b1b; }
  .badge-login { background: #dbeafe; color: #1e40af; }
  .badge-stock { background: #f3e8ff; color: #6b21a8; }
  .audit-chevron { color: #94a3b8; font-size: 10px; transition: transform 0.15s; }
  .audit-row.open .audit-chevron { transform: rotate(90deg); }
  .audit-detail {
    display: none; padding: 10px 12px 14px 66px;
    font-size: 12px; color: #475569; background: #f8fafc;
    border-radius: 6px; margin: -4px 0 8px;
    font-family: 'Menlo', 'Consolas', monospace;
    line-height: 1.7;
  }
  .audit-row.open + .audit-detail { display: block; }
  .audit-detail .kv { display: inline-block; margin-right: 16px; }
  .audit-detail .kv b { color: #334155; }
  .audit-empty { text-align: center; padding: 40px; color: #94a3b8; font-size: 14px; }
</style>
</head>
<body>

<div class="audit-wrap">
  <div class="audit-head">
    <h1>Audit Log</h1>
    <a href="pos.html">← Back to POS</a>
  </div>

  <div class="audit-filters">
    <input type="date" id="fromDate" aria-label="From date">
    <input type="date" id="toDate" aria-label="To date">
    <select id="userFilter"><option value="">All users</option></select>
    <select id="actionFilter">
      <option value="">All actions</option>
      <option value="sale">Sales</option>
      <option value="product_add">Product adds</option>
      <option value="product_edit">Product edits</option>
      <option value="product_delete">Product deletes</option>
      <option value="login">Logins</option>
      <option value="backup">Backups</option>
    </select>
    <input type="text" id="searchFilter" placeholder="Search…">
    <button id="refreshBtn">Refresh</button>
  </div>

  <div id="auditList"><div class="audit-empty">Loading...</div></div>
</div>

<script src="db.js"></script>
<script>
(function () {
  var all = [];

  function badgeClass(a) {
    if (a.indexOf('sale') === 0) return 'badge-sale';
    if (a.indexOf('delete') > -1) return 'badge-delete';
    if (a === 'login' || a === 'login_failed') return 'badge-login';
    if (a.indexOf('stock') > -1) return 'badge-stock';
    return 'badge-edit';
  }

  function fmtTime(iso) {
    var d = new Date(iso);
    return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function render() {
    var from = document.getElementById('fromDate').value;
    var to = document.getElementById('toDate').value;
    var user = document.getElementById('userFilter').value;
    var action = document.getElementById('actionFilter').value;
    var search = document.getElementById('searchFilter').value.toLowerCase();

    var filtered = all.filter(function(e) {
      var d = new Date(e.date).toISOString().slice(0, 10);
      if (from && d < from) return false;
      if (to && d > to) return false;
      if (user && e.user !== user) return false;
      if (action && e.action.indexOf(action) !== 0) return false;
      if (search) {
        var hay = (e.entity_name || '') + ' ' + (e.entity_id || '') + ' ' + (e.details || '') + ' ' + (e.field || '') + ' ' + (e.user || '');
        if (hay.toLowerCase().indexOf(search) === -1) return false;
      }
      return true;
    });

    var byDay = {};
    filtered.forEach(function(e) {
      var day = new Date(e.date).toISOString().slice(0, 10);
      if (!byDay[day]) byDay[day] = [];
      byDay[day].push(e);
    });

    var days = Object.keys(byDay).sort().reverse();

    if (!days.length) {
      document.getElementById('auditList').innerHTML = '<div class="audit-empty">No matching events.</div>';
      return;
    }

    var html = '';
    days.forEach(function(day) {
      var d = new Date(day);
      var label = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      html += '<div class="audit-day"><h3>' + label + '</h3>';
      byDay[day].forEach(function(e) {
        var summary = e.action.replace(/_/g, ' ');
        if (e.entity_name) summary += ' — ' + e.entity_name;

        var detailParts = [];
        if (e.entity) detailParts.push('<span class="kv"><b>Entity:</b> ' + esc(e.entity) + '</span>');
        if (e.entity_id) detailParts.push('<span class="kv"><b>ID:</b> ' + esc(e.entity_id) + '</span>');
        if (e.field) detailParts.push('<span class="kv"><b>Field:</b> ' + esc(e.field) + '</span>');
        if (e.old_value !== null && e.old_value !== undefined) detailParts.push('<span class="kv"><b>Before:</b> ' + esc(e.old_value) + '</span>');
        if (e.new_value !== null && e.new_value !== undefined) detailParts.push('<span class="kv"><b>After:</b> ' + esc(e.new_value) + '</span>');
        if (e.details) detailParts.push('<span class="kv"><b>Note:</b> ' + esc(e.details) + '</span>');
        if (e.device) detailParts.push('<span class="kv"><b>Device:</b> ' + esc(e.device) + '</span>');

        var detail = detailParts.length ? detailParts.join('') : '<span style="color:#94a3b8;">No extra details</span>';

        html += '<div class="audit-row" onclick="this.classList.toggle(\'open\')">'
              + '<div class="audit-time">' + fmtTime(e.date) + '</div>'
              + '<div class="audit-user">' + esc(e.user || 'system') + '</div>'
              + '<div class="audit-action">' + esc(summary) + '</div>'
              + '<div><span class="audit-badge ' + badgeClass(e.action) + '">' + esc(e.action.replace(/_/g, ' ')) + '</span></div>'
              + '<div class="audit-chevron">▶</div>'
              + '</div>'
              + '<div class="audit-detail">' + detail + '</div>';
      });
      html += '</div>';
    });

    document.getElementById('auditList').innerHTML = html;
  }

  async function load() {
    try {
      var db = await openDB();
      var records = await dbGetAll(db, 'audit_log') || [];
      records.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
      all = records;

      var userSel = document.getElementById('userFilter');
      var seen = {};
      userSel.innerHTML = '<option value="">All users</option>';
      all.forEach(function(e) {
        if (e.user && !seen[e.user]) {
          seen[e.user] = true;
          var o = document.createElement('option');
          o.value = e.user; o.textContent = e.user;
          userSel.appendChild(o);
        }
      });

      render();
    } catch (err) {
      document.getElementById('auditList').innerHTML = '<div class="audit-empty">Error loading audit log: ' + err.message + '</div>';
    }
  }

  // Default to today
  var today = new Date().toISOString().slice(0, 10);
  document.getElementById('fromDate').value = today;
  document.getElementById('toDate').value = today;

  document.getElementById('refreshBtn').onclick = load;
  ['fromDate','toDate','userFilter','actionFilter','searchFilter'].forEach(function(id) {
    var el = document.getElementById(id);
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  load();
})();
</script>
</body>
</html>
